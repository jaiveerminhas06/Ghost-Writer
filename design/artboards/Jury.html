<p class="jsum" aria-live="polite"><strong>All 20 detectors flag this essay.</strong> All 20 were trained on the same essays with the same method and are equally accurate; only the random seed differs. A single detector would have shown you just one of these marks.</p>

<p class="jsum" aria-live="polite"><strong>2 of 20 detectors flag this essay; 12 say it is above usual; 6 say it reads like a student’s.</strong> All 20 were trained on the same essays with the same method and are equally accurate; only the random seed differs. A single detector would have shown you just one of these marks.</p>
<p class="disagree">The detectors disagree. That means the jury is less sure. It does not mean a student wrote it.</p>
<details class="why"><summary>Why 20 detectors?</summary><p>On student essays about topics the detectors had not seen, 2.0% got a flag from at least one of the 20, but only 0.1% from all 20. The official verdict, which combines three of them, flagged 0.7%. “At least one of 20” looks worse than any single detector would, so we never quote it alone. The detectors disagree for two reasons: their weights differ with the random seed, and each one’s flag line rests on the few validation essays near it.</p></details><section class="rerun" aria-labelledby="rr-b6"><h3 id="rr-b6">Typos in 11 of 284 words. 13 of 20 detectors changed their mind.</h3>

<h2 class="t-section">Three design decisions, with the alternatives I rejected</h2>
<div class="cols">
<article><h3>1. One scale for the official verdict and the jury (recommended)</h3>
<p>The existing page draws the score on a −10 to +10 logit ruler. A logit means something different for each of the 20 detectors, so the jury cannot use it, and the official verdict is a mean of <em>p</em>-values, which has no logit at all. I propose that the page keeps one ruler, but in the units everything already shares: <em>how many of the 2,291 student essays we checked score this high or higher</em> (1 in 10, 1 in 100, …). The official marker sits on it, the jury hangs directly under it, and the flag line and the “above usual” edge are in the same place for all 21 marks.</p>
<p><strong>Rejected: two scales</strong> (the old logit ruler for seed 42, a second axis for the jury). It would draw the flag line twice at different places and make “the jury disagrees with the verdict” look like a drawing error.</p>
<p class="cost"><strong>Cost:</strong> the “+9.7 / ceiling at +9.8” language disappears from the page and from <code>docs/viva-demo.md</code>; the Strict/Standard switch goes too (the three zones carry what it carried). Say if you want the switch kept as a second flag line at 1 in 1,075 (the 0.5% point).</p></article>
<article><h3>2. The pile-up at the end of the scale: a stack in a box, not a column</h3>
<p>The head saturates, and the position −log₁₀ p cannot go past 3.36 (“higher than every one of the 2,291 student essays”). On a clear AI essay all 20 detectors land exactly there, so a beeswarm would be a column 360 px tall that looks like a measurement. Dots whose position is real are dodged in rows under the ruler. Dots <em>at the end</em> go into a labelled box beside the scale, “Off the scale”, in a grid whose order means nothing, with a bracket to the end of the axis.</p>
<div class="rej"><figure><svg width="150" height="430" viewBox="0 0 150 430" role="img" aria-label="Twenty dots stacked in one column"><line x1="75" x2="75" y1="14" y2="14" class="axis"/><line x1="30" x2="120" y1="30" y2="30" class="axis"/><circle cx="75" cy="44" r="8" class="d-flag"/><circle cx="75" cy="62" r="8" class="d-flag"/><circle cx="75" cy="80" r="8" class="d-flag"/><circle cx="75" cy="98" r="8" class="d-flag"/><circle cx="75" cy="116" r="8" class="d-flag"/><circle cx="75" cy="134" r="8" class="d-flag"/><circle cx="75" cy="152" r="8" class="d-flag"/><circle cx="75" cy="170" r="8" class="d-flag"/><circle cx="75" cy="188" r="8" class="d-flag"/><circle cx="75" cy="206" r="8" class="d-flag"/><circle cx="75" cy="224" r="8" class="d-flag"/><circle cx="75" cy="242" r="8" class="d-flag"/><circle cx="75" cy="260" r="8" class="d-flag"/><circle cx="75" cy="278" r="8" class="d-flag"/><circle cx="75" cy="296" r="8" class="d-flag"/><circle cx="75" cy="314" r="8" class="d-flag"/><circle cx="75" cy="332" r="8" class="d-flag"/><circle cx="75" cy="350" r="8" class="d-flag"/><circle cx="75" cy="368" r="8" class="d-flag"/><circle cx="75" cy="386" r="8" class="d-flag"/><text x="75" y="422" text-anchor="middle" class="tl">360 px tall</text></svg><figcaption class="cap">Rejected: a plain beeswarm at the end.</figcaption></figure></div></article>
<article><h3>3. Marks, not colours</h3>
<p>Flagged, above usual and not flagged are told apart by <strong>fill</strong> (solid, amber with a ring, hollow), by position and by the zone bands, never by colour alone and never green or red. The three detectors inside the official verdict get a blue ring. Each mark has a tooltip and a focus ring; the 20 marks are one tab stop with arrow keys, and the same information is available as a list.</p>
<p><strong>Dark theme.</strong> The app has no dark theme today (<code>color-scheme: light</code>). The boards propose dark tokens (same hues, inverted lightness; amber zones kept) and every text and mark pair on the boards passes (WCAG 4.5:1 for text, 3:1 for marks: 34 pairs in both themes, <code>jury/contrast.csv</code>); they would be added as one block in <code>tokens.css</code>.</p>
<p><strong>Motion.</strong> On Run, the 20 marks drop in one by one (opacity and a 12 px translateY, 40 ms apart, ending by 0.8 s), the official marker lands last with the spring. Re-run: marks move with <code>transform</code> only. Reduced motion: every mark appears in place with a 120 ms fade.</p></article>
